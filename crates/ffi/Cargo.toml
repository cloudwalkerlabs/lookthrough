[package]
name = "lookthrough-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lookthrough_ffi"
crate-type = ["cdylib", "lib"]

[dependencies]
crossbeam-channel = "0.5.17"
lookthrough-core = { version = "0.1.0", path = "../core" }
lookthrough-render = { version = "0.1.0", path = "../render" }
pollster = "1.0.1"
raw-window-handle = "0.6"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uniffi = "0.32"
wgpu = "27.0.1"

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3"
ndk = { version = "0.9.0", default-features = false }
paranoid-android = "0.2.2"

# The JNI entry points and the wgpu surface need unsafe; the workspace forbids
# it, so this crate denies it and allows it per module.
[lints.rust]
unsafe_code = "deny"
